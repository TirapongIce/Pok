version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: local_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huay_aud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for your local test database}"
      POSTGRES_DB: huay_aud_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: