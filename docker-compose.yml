version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: local_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huay_aud
      POSTGRES_PASSWORD: "@Abc1234567890AUD"
      POSTGRES_DB: huay_aud_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: